<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div style="padding-bottom:80px;">
  <header class="search-header">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h1 style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;">Messages</h1>
      <button onclick="window.location.href='explore.html'" style="background:var(--purple);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="search-bar-wrap" style="margin-top:12px;">
      <input type="text" id="msgSearch" placeholder="Search messages..." oninput="filterMessages(this.value)"/>
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- Tabs: Private | Groups -->
  <div style="display:flex;border-bottom:1px solid var(--border);background:var(--bg);">
    <button id="tabPrivate" onclick="switchTab('private')" style="flex:1;padding:14px;background:none;border:none;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:600;color:var(--purple-light);border-bottom:2px solid var(--purple);cursor:pointer;">Private</button>
    <button id="tabGroups" onclick="switchTab('groups')" style="flex:1;padding:14px;background:none;border:none;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;">Groups</button>
  </div>

  <div class="messages-list" id="messagesList">
    <div style="text-align:center;padding:40px;color:var(--text-faint);">Loading messages...</div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item" onclick="window.location.href='home.html'"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='create-group.html'"><i class="fa-solid fa-plus"></i><span>Post</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='explore.html'"><i class="fa-solid fa-globe"></i><span>Explore</span></button>
  <button class="bottom-nav-item active"><i class="fa-solid fa-message"></i><span>Chat</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<script src="js/api.js"></script>
<script>
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);
  if(!requireAuth()) window.location.href='index.html';

  let currentTab = 'private';
  let unreadData = [];
  let groupsData = [];

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabPrivate').style.color = tab==='private'?'var(--purple-light)':'var(--text-muted)';
    document.getElementById('tabPrivate').style.borderBottom = tab==='private'?'2px solid var(--purple)':'2px solid transparent';
    document.getElementById('tabGroups').style.color = tab==='groups'?'var(--purple-light)':'var(--text-muted)';
    document.getElementById('tabGroups').style.borderBottom = tab==='groups'?'2px solid var(--purple)':'2px solid transparent';
    render();
  }

  function render() {
    if(currentTab==='private') renderPrivate(unreadData);
    else renderGroups(groupsData);
  }

  function filterMessages(q) {
    if(currentTab==='private'){
      const filtered = unreadData.filter(c=>(c.username||'').toLowerCase().includes(q.toLowerCase()));
      renderPrivate(filtered);
    } else {
      const filtered = groupsData.filter(g=>(g.group_name||g.destination||'').toLowerCase().includes(q.toLowerCase()));
      renderGroups(filtered);
    }
  }

  function renderPrivate(convos) {
    const el = document.getElementById('messagesList');
    if(!convos.length){
      el.innerHTML=`<div class="empty-state"><i class="fa-solid fa-comments"></i><h3>No messages yet</h3><p>Join a group or find a companion to start chatting!</p></div>`;
      return;
    }
    el.innerHTML = convos.map(c=>`
      <div class="msg-item" onclick="openPrivateChat('${c.user_id}','${c.username}')">
        <div class="msg-avatar-wrap">
          <div class="msg-avatar">${(c.username||'?').slice(0,2).toUpperCase()}</div>
          <div class="msg-online"></div>
        </div>
        <div class="msg-content">
          <div class="msg-name">@${c.username}</div>
          <div class="msg-preview">Tap to open conversation</div>
        </div>
        <div class="msg-meta">
          ${c.unread?`<div class="msg-badge">${c.unread}</div>`:''}
        </div>
      </div>`).join('');
  }

  function renderGroups(groups) {
    const el = document.getElementById('messagesList');
    if(!groups.length){
      el.innerHTML=`<div class="empty-state"><i class="fa-solid fa-users"></i><h3>No group chats yet</h3><p>Join a trip group to start chatting!</p><button onclick="window.location.href='explore.html'" style="margin-top:16px;padding:12px 24px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;">Explore Groups</button></div>`;
      return;
    }
    el.innerHTML = groups.map(g=>`
      <div class="msg-item" onclick="openGroupChat('${g.group_id}')">
        <div class="msg-avatar-wrap">
          <div class="msg-avatar">${(g.destination||g.group_name||'GR').slice(0,2).toUpperCase()}</div>
        </div>
        <div class="msg-content">
          <div class="msg-name">${g.group_name||g.destination}</div>
          <div class="msg-preview">${g.destination||'Tap to open'} · ${g.current_members||0} members</div>
        </div>
        <div class="msg-meta">
          <span class="msg-time">Group</span>
        </div>
      </div>`).join('');
  }

  function openPrivateChat(user_id, username) {
    sessionStorage.setItem('mtm_chat_user', JSON.stringify({user_id, username}));
    window.location.href='private-chat.html';
  }

  function openGroupChat(group_id) {
    sessionStorage.setItem('mtm_group', group_id);
    window.location.href='chat.html';
  }

  async function loadMessages(){
    try {
      // Load unread/private conversations
      const unread = await ChatAPI.getUnread();
      unreadData = unread.conversations || [];

      // Load joined groups
      const groupData = await GroupAPI.getAll();
      groupsData = (groupData.groups||[]).filter(g=>g.joined===1);

      render();
    } catch(err){
      document.getElementById('messagesList').innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-faint);">${err.message}</div>`;
    }
  }

  loadMessages();
</script>
</body>
</html>
