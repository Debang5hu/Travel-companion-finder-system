<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .chat-header{background:var(--purple);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .chat-header-info h2{font-size:.95rem;font-weight:700;color:#fff;}
    .chat-header-info p{font-size:.75rem;color:rgba(255,255,255,.65);}
    .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);}
    .msg-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:.88rem;line-height:1.5;}
    .msg-bubble.theirs{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start;}
    .msg-bubble.mine{background:var(--purple);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
    .msg-time{font-size:.65rem;color:var(--text-faint);margin-top:4px;}
    .mine .msg-time{color:rgba(255,255,255,.6);}
    .chat-input-bar{padding:12px 16px 24px;background:var(--nav-bg);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0;}
    .chat-input-bar input{flex:1;background:var(--input-bg);border:1px solid var(--border-2);border-radius:24px;padding:11px 16px;font-size:14px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;}
    .chat-send{width:40px;height:40px;border-radius:50%;background:var(--purple);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  </style>
</head>
<body>

<div class="chat-header">
  <button onclick="window.history.back()" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-arrow-left"></i></button>
  <div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;" id="chatInitials">??</div>
  <div class="chat-header-info">
    <h2 id="chatTitle">Chat</h2>
    <p>Private Message</p>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <div style="text-align:center;color:var(--text-faint);font-size:.85rem;">Loading messages...</div>
</div>

<div class="chat-input-bar">
  <input type="text" id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()"/>
  <button class="chat-send" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script src="js/api.js"></script>
<script>
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);
  if(!requireAuth()) window.location.href='index.html';

  const chatUser = JSON.parse(sessionStorage.getItem('mtm_chat_user')||'null');
  if(!chatUser){window.location.href='messages.html';}

  const currentUser = JSON.parse(sessionStorage.getItem('mtm_user')||'{}');

  document.getElementById('chatTitle').textContent = '@'+chatUser.username;
  document.getElementById('chatInitials').textContent = chatUser.username.slice(0,2).toUpperCase();

  function renderMessages(msgs) {
    const body = document.getElementById('chatBody');
    if(!msgs.length){
      body.innerHTML='<div style="text-align:center;color:var(--text-faint);font-size:.85rem;padding:20px;">No messages yet. Start the conversation! 👋</div>';
      return;
    }
    body.innerHTML = msgs.map(m => {
      const isMine = m.sender_username === currentUser.username || m.sender_id === currentUser.user_id;
      return `
        <div class="msg-bubble ${isMine?'mine':'theirs'}">
          ${m.message||m.content||''}
          <div class="msg-time">${m.sent_at?new Date(m.sent_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}</div>
        </div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;

    // Mark as read
    ChatAPI.markRead(chatUser.user_id).catch(()=>{});
  }

  async function loadMessages(){
    try {
      const data = await ChatAPI.getMessages(chatUser.user_id);
      renderMessages(data.messages||data||[]);
    } catch(err){
      document.getElementById('chatBody').innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-faint);">${err.message}</div>`;
    }
  }

  async function sendMsg(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    try {
      await ChatAPI.send(chatUser.user_id, text);
      await loadMessages();
    } catch(err){
      showError(err.message||'Could not send message.');
      input.value=text;
    }
  }

  loadMessages();
  setInterval(loadMessages, 5000);
</script>
</body>
</html>
