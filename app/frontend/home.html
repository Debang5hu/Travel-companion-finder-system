<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div id="page-home" style="padding-bottom:80px;display:block;">

  <header class="home-header">
    <button class="hamburger-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    <div class="home-search">
      <input type="text" id="homeSearchInput" placeholder="Search destination or group..." onkeydown="if(event.key==='Enter') goSearch()"/>
      <button onclick="goSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <section class="home-hero">
    <div class="home-hero-silhouette"><img src="images/homepage.jpg" alt=""/></div>
    <div class="home-hero-text">
      <h2>Become a companion</h2>
      <p>or</p>
      <h2>Find a companion</h2>
    </div>
  </section>

  <!-- Recommended Companions -->
  <div class="home-section">
    <div class="home-section-header">
      <span class="home-section-title">✦ Recommended for You</span>
      <span class="home-section-link" onclick="window.location.href='explore.html'">See all</span>
    </div>
    <div id="recScroll" class="rec-scroll">
      <div style="color:var(--text-faint);font-size:.85rem;padding:20px;">Loading recommendations...</div>
    </div>
  </div>

  <!-- Form a Group CTA -->
  <div class="group-cta" onclick="window.location.href='create-group.html'">
    <div class="group-cta-icon">✈️</div>
    <div>
      <h3>Form a Group</h3>
      <p>Create your own trip and find companions who match your vibe.</p>
    </div>
    <i class="fa-solid fa-chevron-right" style="margin-left:auto;color:var(--text-faint);"></i>
  </div>

  <!-- All Groups -->
  <div class="home-section" style="margin-bottom:20px;">
    <div class="home-section-header">
      <span class="home-section-title">Trip Groups</span>
      <span class="home-section-link" onclick="window.location.href='explore.html'">See all</span>
    </div>
    <div id="groupsList" class="trips-list" style="padding:0;">
      <div style="color:var(--text-faint);font-size:.85rem;padding:20px;">Loading groups...</div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="bottom-nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='create-group.html'"><i class="fa-solid fa-plus"></i><span>Post</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='explore.html'"><i class="fa-solid fa-globe"></i><span>Explore</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='messages.html'"><i class="fa-solid fa-message"></i><span>Chat</span></button>
  <button class="bottom-nav-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<script src="js/api.js"></script>
<script src="js/sidemenu.js"></script>
<script>
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);
  if(!requireAuth()) window.location.href='index.html';

  injectSideMenu();
  function toggleMenu(){document.getElementById('sideMenu').classList.toggle('open');document.getElementById('menuOverlay').classList.toggle('active');}
  function closeMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuOverlay').classList.remove('active');}
  function toggleTheme(){const h=document.documentElement,isL=h.getAttribute('data-theme')==='light';h.setAttribute('data-theme',isL?'dark':'light');localStorage.setItem('mtm-theme',isL?'dark':'light');}

  function goSearch(){
    const q=document.getElementById('homeSearchInput').value.trim();
    if(q) sessionStorage.setItem('mtm_search',q);
    window.location.href='explore.html';
  }

  // Render a companion card from recommendation
  function renderCompanionCard(user) {
    return `
      <div class="rec-card" style="min-width:160px;">
        <img src="${user.pfp||'https://i.pravatar.cc/150?img=1'}" alt="${user.username}" loading="lazy" style="width:160px;height:200px;object-fit:cover;display:block;"/>
        <div class="rc-overlay">
          <div class="rc-title" style="font-size:.95rem;">@${user.username}</div>
          <div class="rc-sub">Match score: ${user.score ? (user.score*100).toFixed(0)+'%' : 'N/A'}</div>
        </div>
      </div>`;
  }

  // Render a group card
  function renderGroupCard(g) {
    const isFull = g.current_members >= g.max_members;
    const isPending = g.request_pending === 1;
    const isJoined = g.joined === 1;
    return `
      <div class="trip-card" onclick="openGroup('${g.group_id}')">
        <div class="trip-img-wrap">
          <div style="width:100%;height:150px;background:linear-gradient(135deg,var(--purple-dark),var(--purple));display:flex;align-items:center;justify-content:center;">
            <span style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#fff;letter-spacing:-1px;">${g.destination||g.group_name}</span>
          </div>
        </div>
        <div class="trip-card-body">
          <div class="trip-user-row">
            <div class="trip-avatar">${(g.admin||'?').slice(0,2).toUpperCase()}</div>
            <div>
              <p class="trip-handle">@${g.admin||'unknown'}</p>
              <p class="trip-bio">${g.description||'No description'}</p>
            </div>
          </div>
          <div class="trip-card-footer">
            <div class="trip-spots-row">
              <span class="spots-text">${g.current_members||0}/${g.max_members||'?'} members</span>
            </div>
            <button class="btn-join ${isFull?'full':''}" onclick="event.stopPropagation();joinGroup('${g.group_id}',this)">
              ${isJoined ? '<i class="fa-solid fa-check"></i> Joined'
                : isPending ? '<i class="fa-solid fa-clock"></i> Pending'
                : isFull ? '<i class="fa-solid fa-lock"></i> Full'
                : '<i class="fa-solid fa-plus"></i> Join'}
            </button>
          </div>
        </div>
      </div>`;
  }

  async function joinGroup(group_id, btn) {
    try {
      await GroupAPI.join(group_id);
      btn.innerHTML = '<i class="fa-solid fa-clock"></i> Pending';
      btn.classList.add('full');
      showSuccess('Join request sent!');
    } catch(err) {
      showError(err.message||'Could not join group.');
    }
  }

  function openGroup(group_id) {
    sessionStorage.setItem('mtm_group', group_id);
    window.location.href = 'detail.html';
  }

  // Load data
  async function loadPage() {
    // Load recommendations
    try {
      const data = await RecommendAPI.getUsers(5);
      const recs = data.recommendations || data.users || [];
      if(recs.length) {
        document.getElementById('recScroll').innerHTML = recs.map(u => renderCompanionCard(u)).join('');
      } else {
        document.getElementById('recScroll').innerHTML = '<div style="color:var(--text-faint);font-size:.85rem;padding:20px;">No recommendations yet — complete your profile!</div>';
      }
    } catch(err) {
      document.getElementById('recScroll').innerHTML = `<div style="color:var(--text-faint);font-size:.85rem;padding:20px;">${err.message}</div>`;
    }

    // Load groups
    try {
      const data = await GroupAPI.getAll();
      const groups = data.groups || [];
      if(groups.length) {
        document.getElementById('groupsList').innerHTML = groups.slice(0,4).map(g => renderGroupCard(g)).join('');
      } else {
        document.getElementById('groupsList').innerHTML = '<div style="color:var(--text-faint);font-size:.85rem;padding:20px;">No groups yet. Be the first to create one!</div>';
      }
    } catch(err) {
      document.getElementById('groupsList').innerHTML = `<div style="color:var(--text-faint);font-size:.85rem;padding:20px;">${err.message}</div>`;
    }
  }

  loadPage();
</script>
</body>
</html>
