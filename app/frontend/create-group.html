<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTripMate — Create Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div style="padding-bottom:100px;">
  <header class="search-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button onclick="window.history.back()" style="background:none;color:var(--text-muted);font-size:18px;border:none;cursor:pointer;padding:4px;"><i class="fa-solid fa-arrow-left"></i></button>
      <h1 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;">Post a Trip</h1>
    </div>
  </header>

  <div class="create-form">
    <div class="form-group">
      <label><i class="fa-solid fa-tag"></i> Group Name</label>
      <input type="text" id="f-name" placeholder="e.g. Paris Adventure Squad"/>
    </div>
    <div class="form-group">
      <label><i class="fa-solid fa-map-location-dot"></i> Destination</label>
      <input type="text" id="f-dest" placeholder="e.g. Paris, France"/>
    </div>
    <div class="form-group">
      <label><i class="fa-solid fa-align-left"></i> Description</label>
      <textarea id="f-desc" placeholder="Tell people what this trip is about..."></textarea>
    </div>
    <div class="form-group">
      <label><i class="fa-regular fa-calendar"></i> Travel Month</label>
      <select id="f-month">
        <option value="">Select month...</option>
        <option value="1">January</option><option value="2">February</option>
        <option value="3">March</option><option value="4">April</option>
        <option value="5">May</option><option value="6">June</option>
        <option value="7">July</option><option value="8">August</option>
        <option value="9">September</option><option value="10">October</option>
        <option value="11">November</option><option value="12">December</option>
      </select>
    </div>
    <div class="form-group">
      <label><i class="fa-solid fa-users"></i> Max Members</label>
      <select id="f-max">
        <option value="2">2 people</option>
        <option value="3">3 people</option>
        <option value="4" selected>4 people</option>
        <option value="5">5 people</option>
        <option value="6">6 people</option>
        <option value="8">8 people</option>
        <option value="10">10+ people</option>
      </select>
    </div>
  </div>
</div>

<div class="create-submit">
  <button id="submitBtn" onclick="submitTrip()">Post Trip ✈️</button>
</div>

<script src="js/api.js"></script>
<script>
  const saved = localStorage.getItem('mtm-theme')||'dark';
  document.documentElement.setAttribute('data-theme', saved);
  if(!requireAuth()) window.location.href='index.html';

  async function submitTrip(){
    const group_name = document.getElementById('f-name').value.trim();
    const destination = document.getElementById('f-dest').value.trim();
    const description = document.getElementById('f-desc').value.trim();
    const travel_month = parseInt(document.getElementById('f-month').value)||0;
    const max_members = parseInt(document.getElementById('f-max').value)||4;

    if(!group_name||!destination){showError('Please fill in group name and destination.');return;}

    const btn = document.getElementById('submitBtn');
    setLoading(btn, true);

    try {
      await GroupAPI.create({group_name, destination, description, travel_month, max_members});
      showSuccess('Trip group created! 🎉');
      setTimeout(()=>window.location.href='explore.html', 1200);
    } catch(err){
      showError(err.message||'Could not create group. Please try again.');
      setLoading(btn, false, 'Post Trip ✈️');
    }
  }
</script>
</body>
</html>
